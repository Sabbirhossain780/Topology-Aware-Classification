# Canonical pipeline config — replaces dhaka_topology_v3.ipynb
# 1km grid, 800+ zones, UFFM + GAT stages enabled.
name: v3

bbox_north: 23.95
bbox_south: 23.65
bbox_east: 90.48
bbox_west: 90.25
network_type: all

crs_metric: EPSG:32646
crs_geo: EPSG:4326

zone_unit: grid
cell_size_m: 1000.0
buffer_m: 800.0
min_nodes: 15

betweenness_k: 50
pagerank_alpha: 0.85
katz_alpha: 0.1
diameter_sample_n: 300
bootstrap_n: 20
cv_threshold: 0.35
orientation_bins: 36

k_min: 2
k_max: 8
pca_variance: 0.95
random_state: 42
dbscan_min_samples: 5

uffm_enabled: true
bearing_bins: 36
angle_bins: 36
length_bins: 40
length_max_m: 500.0
w_bearing: 0.40
w_angle: 0.35
w_length: 0.25

gat_enabled: true
gat_plot_dpi: 150
gat_do_plots: true

base_dir: ../../pipeline_outputs/v3
