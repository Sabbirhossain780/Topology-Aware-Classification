# Administrative-unit config — replaces dhaka_topology_thana.ipynb
# Uses thana boundary polygons instead of a square grid.
name: thana

bbox_north: 23.95
bbox_south: 23.65
bbox_east: 90.48
bbox_west: 90.25
network_type: all

crs_metric: EPSG:32646
crs_geo: EPSG:4326

zone_unit: thana
thana_boundary_path: ../data/thana_boundaries.gpkg  # supply your own boundary file
buffer_m: 800.0
min_nodes: 15

betweenness_k: 50
pagerank_alpha: 0.85
katz_alpha: 0.1
diameter_sample_n: 300
bootstrap_n: 20
cv_threshold: 0.35
orientation_bins: 36

k_min: 2
k_max: 8
pca_variance: 0.95
random_state: 42
dbscan_min_samples: 5

uffm_enabled: false
gat_enabled: false

base_dir: ../../pipeline_outputs/thana
